name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == '8533502-dev/ANingNeo-skills'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build packages and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to publish."
            exit 0
          fi

          mkdir -p \
            stage/aningneo-knowledge \
            stage/aningneo-research \
            stage/aningneo-local-store \
            dist

          cp -a skills/aningneo-knowledge/. stage/aningneo-knowledge/
          cp -a skills/aningneo-research/. stage/aningneo-research/
          cp -a skills/aningneo-local-store/. stage/aningneo-local-store/

          cp LICENSE stage/aningneo-knowledge/LICENSE
          cp NOTICE.md stage/aningneo-knowledge/NOTICE.md
          cp LICENSE stage/aningneo-research/LICENSE
          cp NOTICE.md stage/aningneo-research/NOTICE.md
          cp NOTICE.md stage/aningneo-local-store/ANINGNEO_NOTICE.md

          (
            cd stage
            zip -qr ../dist/aningneo-knowledge.zip aningneo-knowledge
            zip -qr ../dist/aningneo-research.zip aningneo-research
            zip -qr ../dist/aningneo-local-store.zip aningneo-local-store
          )

          cat > dist/release-notes.md <<'EOF'
          ## ANingNeo Skills v0.9.1

          本次发布完成 ANingNeo 品牌与目录统一，Skill 的核心能力、调用方式和使用流程保持不变。

          ### 本次更新

          - 实体门店 Skill 统一为 `ANingNeo Local Store`
          - Skill ID、目录和配置路径统一为 `aningneo-local-store`
          - 下载包统一为 `aningneo-local-store.zip`
          - README、安装说明、脚本标识和自动化测试同步更新
          - 知识库说明图采用新版视觉风格

          ### 验证结果

          - 34 个核心测试通过
          - 12 个模板测试通过
          - 66 个图片接口适配测试通过
          - 3 个 Skill 结构验证通过
          EOF

          gh release create "${tag}" \
            dist/aningneo-knowledge.zip \
            dist/aningneo-research.zip \
            dist/aningneo-local-store.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ANingNeo Skills ${tag}" \
            --notes-file dist/release-notes.md \
            --latest
